
---
- name: Deploy portfolio to Apache server
  hosts: apache
  become: yes

  tasks:
    - name: Install Apache2
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Copy portfolio to Apache web root
      copy:
        src: /root/portfolio/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: preserve

    - name: Start Apache2
      service:
        name: apache2
        state: started
        enabled: yes


- name: Deploy portfolio to Nginx server
  hosts: nginx
  become: yes

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Copy portfolio to Nginx web root
      copy:
        src: /root/portfolio/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: preserve

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: yes
